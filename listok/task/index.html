<!--
  Страница для того, кому прислали задачу из «Листка», а приложения у него нет или ссылка
  открылась в браузере.

  Задача едет целиком во фрагменте адреса (после «#»): фрагмент не уходит на сервер ни в запросе,
  ни в Referer, поэтому содержимое чужих задач хостингу неизвестно. Разбираем его здесь, на
  устройстве.

  Если в задаче есть id (новые ссылки), рядом в Firestore лежит документ delegations/{id} — по нему
  автор узнаёт, что задачу взяли и сделали. Тогда страница входит в Firebase анонимно (без
  регистрации) и даёт отметить: «Беру», «Готово», «Вернуть автору». Кто что может записать, решают
  правила Firestore: двигать статус может только тот, кто взял задачу первым.

  Если приложение установлено, iOS сюда даже не заходит: адрес перехватывается как universal link
  по заявке в /.well-known/apple-app-site-association.

  Языки те же четыре, что и в приложении, и берутся у браузера: задачу присылают тому, у кого
  «Листка» может и не быть вовсе, — значит, и языка отправителя у него тоже может не быть.
  Неизвестный язык получает английский, как и в `Loc.s`.
-->
<style>

    --bg: #F4F3EF; --card: #FFFFFF; --text: #1B1A17; --sub: #5E5B54;

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151410; --card: #1F1E19; --text: #F2EFE8; --sub: #B0ABA0;
      --line: #2F2D26; --accent: #E8845C; --accent-soft: #3A2419;
    }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px 40px;

  .wrap { max-width: 560px; margin: 0 auto; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
  h1 { font-size: 28px; line-height: 1.2; margin: 6px 0 16px; font-weight: 700; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 16px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 13px; padding: 5px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .chip.plain { background: var(--line); color: var(--sub); }
  .status { margin: 0 0 16px; }
  .status p { margin: 0 0 10px; color: var(--sub); font-size: 15px; }
  .status .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .status button {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    background: var(--accent); color: var(--bg); flex: 1; min-width: 140px;
  }
  .status button.quiet { background: var(--line); color: var(--text); }
  .status button:disabled { opacity: 0.5; }
  a.open {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    background: var(--accent); color: var(--bg); padding: 14px; border-radius: 14px;
  }
  p.note { color: var(--sub); font-size: 14px; }
</style>

    .find(l => STRINGS[l]) || 'en';
  const L = STRINGS[lang];
  document.getElementById('html').lang = lang;

  function decode(hash) {
    const dot = hash.indexOf('.');
    if (dot < 0 || hash.slice(0, dot) !== 'v1') return null;
    let s = hash.slice(dot + 1).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    try {
      const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }

  // Срок «на день» приложение шлёт полднем этого числа по UTC — число и показываем по UTC,
  // иначе у получателя в другом поясе оно съезжало бы на соседнее. Старые ссылки несут
  // полночь отправителя — их читаем, как раньше, по своему поясу.
  function when(due) {
    if (!due) return null;
    const ms = due.date * 1000;
    const utcDay = !due.hasTime && ((Math.round(due.date) % 86400) + 86400) % 86400 === 43200;
    const d = utcDay ? (() => { const u = new Date(ms); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); })() : new Date(ms);
    let s = L.date(d, L.days[d.getDay()], L.months[d.getMonth()]);
    if (due.hasTime) s += ', ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    return s;
  }

  function chip(text, plain) {
    const el = document.createElement('span');
    el.className = plain ? 'chip plain' : 'chip';
    el.textContent = text;
    document.getElementById('chips').appendChild(el);
  }

  const hash = location.hash.replace(/^#/, '');
  const task = hash ? decode(hash) : null;

  document.getElementById('eyebrow').textContent = L.eyebrow;
  document.getElementById('open').textContent = L.open;

  if (!task || !task.t) {
    document.title = L.broken;
    document.getElementById('title').textContent = L.broken;
    document.getElementById('note').textContent = L.brokenNote;
    document.getElementById('open').style.display = 'none';
  } else {
    document.title = task.t;
    document.getElementById('title').textContent = task.t;
    const due = when(task.d);
    if (due) chip('📅 ' + due);
    const deadline = when(task.dl);
    if (deadline) chip('🏁 ' + L.deadline + deadline);
    if (task.p && task.p < 4) chip(L.priority + task.p);
    (task.l || []).forEach(name => chip('@' + name, true));
    if (task.pr) chip(task.pr, true);
    document.getElementById('open').href = 'todo://share#' + hash;
    document.getElementById('note').textContent = L.note;
  }
  // Для статуса ниже: задача и язык — из этого же разбора.
  window.listokTask = task;
  window.listokLang = lang;
</script>

      const app = initializeApp(FIREBASE);
      const me = (await signInAnonymously(getAuth(app))).user.uid;
      const ref = fs.doc(fs.getFirestore(app), 'delegations', task.id);

      const set = (status, extra) => fs.updateDoc(ref, Object.assign(
        { status, assignee: me, updatedAt: fs.serverTimestamp() }, extra || {}));

      const button = (label, quiet, action) => {
        const b = document.createElement('button');
        b.textContent = label;
        if (quiet) b.className = 'quiet';
        b.onclick = async () => {
          b.disabled = true;
          try { await action(); } catch (e) { text.textContent = T.error; b.disabled = false; }
        };
        buttons.appendChild(b);
      };

      // Живое состояние: отметили на другом устройстве — страница сразу это показывает.
      fs.onSnapshot(ref, (snap) => {
        buttons.innerHTML = '';
        if (!snap.exists()) { box.hidden = true; return; }
        const d = snap.data();
        box.hidden = false;
        const mine = d.assignee === me;
        if (d.status === 'revoked') {
          text.textContent = T.revoked;
        } else if (d.assignee && !mine) {
          text.textContent = T.other;
        } else if (d.status === 'sent' || !d.assignee) {
          text.textContent = T.sent;
          button(T.take, false, () => set('accepted', { acceptedAt: fs.serverTimestamp() }));
        } else if (d.status === 'accepted') {
          text.textContent = T.accepted;
          button(T.done, false, () => set('done', { doneAt: fs.serverTimestamp() }));
          button(T.decline, true, () => set('declined'));
        } else if (d.status === 'done') {
          text.textContent = T.isDone;
          button(T.reopen, true, () => set('accepted'));
        } else if (d.status === 'declined') {
          // Задача уже вернулась к автору — взять её снова можно только по новой ссылке.
          text.textContent = T.declined;
        }
      }, () => { box.hidden = true; });
    } catch (e) {
      // Без сети остаётся то, что было: задача и кнопка «Открыть в «Листке»».
    }
  }
</script>
</body>
</html>
