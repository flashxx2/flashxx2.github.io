<!--
  Страница, которую открывает родственник по ссылке из «Листка», — с бронью подарков, как у
  GiftList, Followish и Giftster.

  Список лежит в Firestore (проект listok-584f2) документом wishlists/{токен}, токен — во
  фрагменте адреса после «#»: фрагмент не уходит на сервер ни в запросе, ни в Referer, поэтому
  ссылка не оседает в журналах хостинга. Гость входит анонимно — без регистрации и пароля, — и
  его «Подарю я» становится документом wishlists/{токен}/reservations/{id желания}. Создать его
  можно, только если его ещё нет: два человека одно желание не займут. Владелец списка брони не
  видит (это правило Firestore, а не только страницы) — только сколько желаний уже взяли.

  Referer — «strict-origin»: Firebase получает только адрес сайта, без пути и фрагмента, а
  магазины по ссылкам «Посмотреть в магазине» — тоже только сайт.

  Без сети и для правки вёрстки: ?demo=1 берёт образец из demo.json.
-->

// Копейки и центы — только если они есть: «$19.99», но «5 000 ₽». Как в приложении.
const hasCents = (value) => Math.round(Math.abs(value) * 100) % 100 !== 0;

// У каждого желания может быть своя валюта (код «USD»): пишем её так, как принято у читателя.
function moneyIn(value, code) {
  const digits = hasCents(value) ? 2 : 0;
  try {
    return new Intl.NumberFormat(lang, { style: "currency", currency: code,
      minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value);
  } catch (e) {
    return money(value, code);
  }
}

function money(value, currency) {
  if (value === null || value === undefined) return "";
  const [whole, cents] = Number(value).toFixed(hasCents(value) ? 2 : 0).split(".");
  // Пробелы между разрядами — как в приложении.
  return whole.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (cents ? "," + cents : "") + " " + currency;
}

function untilEvent(seconds) {
  if (!seconds) return "";
  const days = Math.ceil((seconds * 1000 - Date.now()) / 86400000);
  if (days < 0) return L.past;
  // «завтра», «через 3 дня», «in 3 days» — с правильным склонением на любом языке.
  try {
    return new Intl.RelativeTimeFormat(lang, { numeric: "auto" }).format(days, "day");
  } catch (e) {
    return String(days);
  }
}

let me = null;                // анонимный uid гостя
let api = null;               // Firestore: ссылки и функции записи
let opened = null;            // желание, у которого открыта строка «Ваше имя»

function toast(text) { $("toast").textContent = text || ""; }

function actions(item) {
  const r = reservations[String(item.id)];
  if (!api) return "";
  if (!r) {
    if (opened === String(item.id)) {
      return `<div class="actions">
        <input id="name-${escape(item.id)}" maxlength="40" placeholder="${escape(L.name)}" autocomplete="given-name">
        <button data-act="confirm" data-id="${escape(item.id)}">${escape(L.confirm)}</button>
        <button class="quiet" data-act="close">${escape(L.cancel)}</button></div>`;
    }
    return `<div class="actions"><button data-act="open" data-id="${escape(item.id)}">${escape(L.reserve)}</button></div>`;
  }
  if (r.guest === me) {
    const label = r.state === "bought" ? L.mineBought : L.mine;
    const buy = r.state === "bought" ? "" : `<button class="quiet" data-act="bought" data-id="${escape(item.id)}">${escape(L.markBought)}</button>`;
    return `<div class="actions"><span class="badge">${escape(label)}</span>${buy}
      <button class="quiet" data-act="release" data-id="${escape(item.id)}">${escape(L.unreserve)}</button></div>`;
  }
  const name = (r.name || "").trim();
  const label = r.state === "bought" ? (name ? L.boughtBy(name) : L.bought) : (name ? L.takenBy(name) : L.taken);
  return `<div class="actions"><span class="badge">${escape(label)}</span></div>`;
}

function render() {
  document.title = list.title || L.list;
  $("title").textContent = list.title || L.list;
  const when = untilEvent(list.eventDate);
  $("event").textContent = when ? L.event(when) : "";

  if (!list.items || list.items.length === 0) {
    $("items").innerHTML = "";
    $("status").textContent = L.empty;
    $("hint").hidden = true;
    return;
  }

  $("items").innerHTML = list.items.map((item) => {
    const price = item.price !== null && item.price !== undefined
      ? `<span class="price">${escape(item.currency ? moneyIn(item.price, item.currency) : money(item.price, list.currency || "₽"))}</span>` : "";
    // Ссылка на магазин — самое полезное для того, кто пойдёт покупать.
    const shop = item.url
      ? `<a class="shop" href="${escape(item.url)}" target="_blank" rel="noopener noreferrer nofollow">${escape(L.shop)}</a>`
      : "";
    const stars = "★".repeat(Math.max(1, Math.min(3, item.stars || 1)));
    const r = reservations[String(item.id)];
    const taken = r && r.guest !== me ? " taken" : "";
    return `<li class="${taken}"><div class="body">
      <div class="row"><span class="title">${escape(item.title)}</span>${price}</div>
      <div class="stars" title="${escape(L.stars)}">${stars}</div>${shop}
      ${actions(item)}
    </div></li>`;
  }).join("");

  $("status").textContent = "";
  $("hint").hidden = !api;
  if (opened) { const field = $("name-" + opened); if (field) field.focus(); }
}

// ---------- Действия гостя ----------

$("items").addEventListener("click", async (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  const id = button.dataset.id;
  toast("");
  if (button.dataset.act === "open") { opened = id; return render(); }
  if (button.dataset.act === "close") { opened = null; return render(); }
  button.disabled = true;
  try {
    if (button.dataset.act === "confirm") {
      const name = ($("name-" + id)?.value || "").trim().slice(0, 40);
      await api.reserve(id, name);
      opened = null;
    } else if (button.dataset.act === "release") {
      await api.release(id);
    } else if (button.dataset.act === "bought") {
      await api.markBought(id);
    }
  } catch (e) {
    // Бронь уже есть — правила не дали создать вторую.
    toast(e && e.code === "permission-denied" ? L.late : L.error);
    button.disabled = false;
  }
});

// ---------- Загрузка ----------

function fail(message) { $("status").textContent = message; }

async function load() {
  const params = new URLSearchParams(location.search);
  if (params.get("demo")) {
    // Образец: страницу можно смотреть и править без сети.
    const res = await fetch("demo.json");
    list = await res.json();
    return render();
  }

  const token = location.hash.slice(1);
  if (!/^[a-hj-km-np-z2-9]{22}$/.test(token)) return fail(L.broken);

  try {
    const { initializeApp } = await import(`${SDK}/firebase-app.js`);
    const { getAuth, signInAnonymously } = await import(`${SDK}/firebase-auth.js`);
    const fs = await import(`${SDK}/firebase-firestore.js`);
    const app = initializeApp(FIREBASE);
    const auth = getAuth(app);
    me = (await signInAnonymously(auth)).user.uid;
    const db = fs.getFirestore(app);
    const listRef = fs.doc(db, "wishlists", token);
    const reservationsRef = fs.collection(db, "wishlists", token, "reservations");

    api = {
      reserve: (id, name) => fs.setDoc(fs.doc(reservationsRef, id),
        Object.assign({ guest: me, state: "reserved", at: fs.serverTimestamp() }, name ? { name } : {})),
      release: (id) => fs.deleteDoc(fs.doc(reservationsRef, id)),
      markBought: (id) => fs.updateDoc(fs.doc(reservationsRef, id), { state: "bought", at: fs.serverTimestamp() }),
    };

    // Живые обновления: кто-то забронировал, пока страница открыта, — кнопка гаснет сразу.
    fs.onSnapshot(listRef, (snap) => {
      if (!snap.exists()) { list = null; $("items").innerHTML = ""; $("hint").hidden = true; return fail(L.missing); }
      try { list = JSON.parse(snap.data().payload); } catch (e) { return fail(L.failed); }
      render();
    }, () => fail(L.failed));
    fs.onSnapshot(reservationsRef, (snap) => {
      reservations = {};
      snap.forEach((d) => { reservations[d.id] = d.data(); });
      if (list) render();
    }, () => {});
  } catch (e) {
    fail(L.failed);
  }
}

load();
</script>
</body>
</html>
