<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Листок</title>
<style>
  :root { --bg:#F4F3EF; --text:#1B1A17; --sub:#5E5B54; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151410; --text:#F2EFE8; --sub:#B0ABA0; } }
  body { margin:0; background:var(--bg); color:var(--text); padding:48px 20px;
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--sub); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Листок</h1>
    <p>Страницы для ссылок из приложения: задача и список желаний.
       Открывать их напрямую незачем — адрес приходит вместе со ссылкой.</p>
  </div>
</body>
</html>
